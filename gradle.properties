# Rendimiento de Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft 26.x ya no usa mapeos de terceros (Yarn): el juego se distribuye
# sin ofuscar y con los nombres oficiales de Mojang, por lo que no se declara
# una dependencia de "mappings" en build.gradle.
# Fuente: https://fabricmc.net/2026/03/14/261.html
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17

# Propiedades del mod
mod_version=0.1.0
maven_group=com.wildbound
archives_base_name=wildbound

# Dependencias
fabric_version=0.155.0+26.3

# [PENDIENTE DE PRUEBA] Confirmar loader_version/loom_version exactos en
# https://fabricmc.net/develop en el momento de compilar: esta plantilla se
# escribió a partir de los anuncios oficiales de Fabric para 26.1-26.3, pero
# no se ha compilado en este entorno (sin acceso de red para Gradle/Maven).
